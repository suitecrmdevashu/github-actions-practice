name: CI
on: 
  push:
    branches: main
  pull_request:
    branches: main
    
permissions:
  contents: read
    
jobs:
  on-push-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with: 
          node-version: 20
         

      - name: Install dependencies
        run: npm ci && npm run lint

      - name: Test
        run: npm test -- --coverage
